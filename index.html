  <!-- Structured Data (JSON-LD) — permite que Google muestre horario,
       teléfono y zona de servicio directamente en resultados de búsqueda
       locales. No hay dirección exacta de calle porque el servicio es
       mayormente móvil/remoto; se declara a nivel de región y municipios,
